name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 by name is refused before a runner is even picked: the job comes back cancelled in
        # one second with "The configuration 'macos-14-arm64-us-default' is not supported", and the
        # release job then skips itself because it waits for all three. The moving image is arm64 the
        # same way, and the archive is named after the machine that built it, not after this label.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Test
        run: uv run --frozen python scripts/run-tests.py

      - name: Report test failures
        if: failure()
        run: uv run --frozen python scripts/report-test-failures.py

      - name: Build
        run: uv run python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-companion-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
